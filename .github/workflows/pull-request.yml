name: Pull request build test

on:
  pull_request:

env:
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  build:
    strategy:
      matrix:
        os:
          # - ubuntu-latest
          - macos-latest
          # - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            wayland-protocols \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            zlib1g-dev \
            pkg-config \
            libxkbcommon-dev \
            python3 \
            python3-pip \
            python3-dev

      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: cmake --build build --target mygame --config Release --parallel 2

      - name: Install
        run: |
             cmake --install build \
               --prefix "${{ github.workspace }}/dist"
