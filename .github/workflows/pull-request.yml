name: Pull request build test

on:
  pull_request:

env:
  CMAKE_POLICY_VERSION_MINIMUM: 3.5

jobs:
  build:
    strategy:
      matrix:
        os:
          # - ubuntu-latest
          - macos-latest
          # - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libwayland-dev \
            wayland-protocols \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            zlib1g-dev \
            pkg-config \
            libxkbcommon-dev \
            python3 \
            python3-pip \
            python3-dev

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
      
      - name: Configure R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.SECRET_ACCESS_KEY }}
          endpoint = https://b378d1f96efa355e3733177c37f0c9e7.eu.r2.cloudflarestorage.com
          EOF
      
      - name: Download game assets
        run: |
          rclone sync r2:gameformykids/resources/ resources/

      - name: Configure CMake
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target gameformykids --config Release --parallel 2

      - name: Install
        run: |
             cmake --install build \
               --prefix "${{ github.workspace }}/dist"
